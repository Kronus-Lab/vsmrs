# cargo-audit configuration.
#
# RUSTSEC-2023-0071 affects RSA *private-key* operations (the Marvin timing
# side channel in rsa < 0.10). VSM reaches `rsa` only through openidconnect's
# RS256/RS384/RS512 ID-token signature verification, which uses public keys;
# the affected code path is not reachable. openidconnect 4.1.0 cannot move to
# rsa >= 0.10 without an upstream API break, so the advisory is ignored until
# the dependency can be upgraded. Every other advisory remains enforced.
[advisories]
ignore = [
    "RUSTSEC-2023-0071",
]
