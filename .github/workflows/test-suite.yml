name: Test suite

on: [pull_request]

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        lfs: true

    - name: Install cargo-deny
      uses: taiki-e/install-action@cargo-deny

    - name: Install cargo-audit
      uses: taiki-e/install-action@cargo-audit

    - name: Check formatting
      run: cargo fmt --check

    - name: Clippy
      run: cargo clippy --all-targets -- -D warnings

    - name: Unit tests
      run: cargo test

    - name: Audit dependencies
      run: cargo audit

    - name: Check licenses
      run: cargo deny check licenses

  e2etests:
    name: End to End tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        lfs: true

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Cache build toolchain and crates
      uses: actions/cache@v4
      with:
        path: ~/.cache/vsm-build
        key: ${{ runner.os }}-vsm-build-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
        restore-keys: ${{ runner.os }}-vsm-build-

    - name: Build
      run: VSM_CACHE_DIR=$HOME/.cache/vsm-build ./scripts/build-image.sh

    - name: Check binary is statically linked
      run: |
        file dist/vsm | tee binary-file.txt
        grep -q 'statically linked' binary-file.txt
        # musl static binaries are reported as "not a dynamic executable" by ldd.
        ldd_output=$(ldd dist/vsm 2>&1 || true)
        echo "$ldd_output"
        echo "$ldd_output" | grep -Eq 'not a dynamic executable|statically linked'

    - name: Check scratch image contents
      run: |
        container_id=$(docker create kr0nus/vsm:devel)
        trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
        docker export "$container_id" | tar -t > image-files.txt
        cat image-files.txt
        # WORKDIR /app may add a directory entry; /vsm must be the only file.
        files=$(grep -vE '/$|^\.$' image-files.txt || true)
        if [ "$files" != "vsm" ]; then
          echo "unexpected image files (expected only vsm): $files" >&2
          exit 1
        fi
        if grep -Eq '(^|/)(bin/sh|etc/ssl|etc/passwd|ca-certificates|config)(/|$)' image-files.txt; then
          echo "image contains a shell, CA bundle, or baked-in config" >&2
          exit 1
        fi

    - name: Check image runtime user
      run: |
        user=$(docker inspect -f '{{.Config.User}}' kr0nus/vsm:devel)
        echo "Image Config.User: $user"
        if [ "$user" != "65532:65532" ]; then
          echo "expected numeric uid/gid 65532:65532, got '$user'" >&2
          exit 1
        fi

    - name: SBOM
      uses: anchore/sbom-action@v0
      with:
        image: kr0nus/vsm:devel

    - name: Start test stack
      uses: adambirds/docker-compose-action@v1.4.0
      with:
        compose-file: |
          ./docker-compose-common.yml
          ./docker-compose-e2e.yml

    - name: Wait for stack to be up
      timeout-minutes: 5
      run: |
        ./test/presetup/wait.sh

    - name: Setup OpenTofu in execution
      uses: opentofu/setup-opentofu@v1
      with:
        tofu_version: "1.13.10"

    - name: Configure test infrastructure
      run: |
        cd test/presetup
        tofu init --upgrade
        tofu apply --auto-approve

    - name: Wait for Application to be up
      timeout-minutes: 5
      run: |
        echo "Waiting for VSM to start"
        while [ $(curl -sI http://vsm.local.kronus.network | head -n1 | cut -d ' ' -f 2) -ge 400 ]; do
            echo -n '.'
            sleep 1
            done

    - name: Execute test suite - Chrome
      uses: cypress-io/github-action@v6
      with:
        browser: chrome
        spec: cypress/e2e/vsm.cy.js
    
    - name: Upload execution screenshots (Chrome)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Screenshots-Chrome
        path: ./cypress/screenshots

    - name: Cleanup test suite execution
      run: |
        rm -rf ./cypress/screenshots
        rm -rf ./cypress/downloads

    - name: Execute test suite - Firefox
      uses: cypress-io/github-action@v6
      with:
        browser: firefox
        spec: cypress/e2e/vsm.cy.js
    
    - name: Upload execution screenshots (Firefox)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Screenshots-Firefox
        path: ./cypress/screenshots

  integrationtests:
    name: Integration Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        lfs: true

    - name: Start test stack
      uses: adambirds/docker-compose-action@v1.4.0
      with:
        compose-file: |
          ./docker-compose-common.yml
          ./docker-compose-integration.yml


    - name: Wait for stack to be up
      timeout-minutes: 5
      run: |
        ./test/presetup/wait.sh

    - name: Setup OpenTofu in execution
      uses: opentofu/setup-opentofu@v1
      with:
        tofu_version: "1.13.10"

    - name: Configure test infrastructure
      run: |
        cd test/presetup
        tofu init --upgrade
        tofu apply --auto-approve

    - name: Build release binary
      run: cargo build --release

    - name: Start VSM
      run: |
        nohup ./target/release/vsm > vsm.log 2>&1 &
        echo $! > vsm.pid

    - name: Wait for VSM to be ready
      timeout-minutes: 5
      run: |
        for _ in $(seq 1 60); do
          status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/ || true)
          if [ "$status" = "302" ]; then
            echo "VSM ready on localhost:3000 (HTTP $status)"
            exit 0
          fi
          echo "Waiting for VSM on localhost:3000 (HTTP ${status:-none})"
          sleep 1
        done
        echo "VSM did not become ready; log follows:"
        cat vsm.log
        exit 1

    - name: Run Rust integration tests
      env:
        VSM_BASE_URL: http://localhost:3000
      run: cargo test --test integration -- --ignored
