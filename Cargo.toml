[package]
name = "vsm"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros", "form"] }
axum-extra = { version = "0.10", features = ["cookie", "cookie-signed"] }
cookie = { version = "0.18", features = ["signed"] }
hex = "0.4"
hkdf = "0.12"
minijinja = "3.1"
rand = "0.9"
redis = { version = "0.32", features = ["tokio-comp"] }
rust-embed = { version = "8.14", features = ["debug-embed"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = "0.3"
url = "2"
openidconnect = { version = "4.1.0", features = ["reqwest"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
webpki-roots = "0.26"
serde_urlencoded = "0.7"
subtle = "2"

[dev-dependencies]
chrono = "0.4"
wiremock = "0.6"
